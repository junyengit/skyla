name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  ci-build:
    name: ci-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Bun canary and dependencies
        run: bash scripts/setup/vercel-install-bun-canary.sh

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Convex schema typecheck
        run: bun run convex:schema:typecheck

      - name: Convex functions typecheck
        run: bun run convex:functions:typecheck

      - name: Build
        run: bun run build

      - name: Security gates
        run: bun run security

  browser-test:
    name: browser-test
    needs: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Bun canary and dependencies
        run: bash scripts/setup/vercel-install-bun-canary.sh

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Browser workflows
        run: bun run --cwd apps/web test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/skyla-playwright-results

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skyla-playwright-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skyla-playwright-results
          if-no-files-found: ignore
          retention-days: 7
