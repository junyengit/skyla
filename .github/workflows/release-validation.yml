name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-build:
    name: ci-build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned Bun canary and dependencies
        run: bash scripts/setup/vercel-install-bun-canary.sh

      - name: Validate repository
        run: bun run check

      - name: Security audit
        run: bun run security

      - name: Install pinned Chromium
        run: bun run --cwd apps/web test:e2e:install

      - name: Browser workflows
        run: bun run --cwd apps/web test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/skyla-playwright-results

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: skyla-release-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skyla-playwright-results
          if-no-files-found: ignore
          retention-days: 7
